<!-- ============================================================
     Wenine Hours — page structure (HTML only)
     Styling:  css/stylesheet.css
     Behavior: script.js  (loaded at the bottom, after the markup)
     ============================================================ -->
<title>Wenine Hours</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Fonts: Young Serif for headings, IBM Plex Sans for everything else -->
<link rel="stylesheet"
  href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/stylesheet.css">

<!-- ======================= main page ======================= -->
<div class="wrap">
  <header class="top">
    <h1 class="wordmark">Wenine <small>stage hours</small></h1>
    <nav class="page-nav">
      <a href="index.html" class="current">Hour tracker</a>
      <a href="schedule.html">Schedule</a>
    </nav>
    <span class="storage-note" id="storageNote"></span>
  </header>

  <!-- person chips + "add person" + the selected person's work period -->
  <div class="people" id="peopleRow"></div>

  <!-- summary tiles, month navigation and the calendar are rendered here by script.js -->
  <div id="mainArea"></div>
</div>

<!-- ================== day editor pop-up ==================== -->
<div class="overlay hidden" id="dayOverlay" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
  <div class="modal">
    <h3 id="dayTitle"></h3>
    <div class="modal-sub" id="daySub"></div>

    <!-- worked / free toggle -->
    <div class="seg" id="statusSeg">
      <button type="button" class="worked" id="segWorked">Worked</button>
      <button type="button" class="free" id="segFree">Free</button>
    </div>

    <!-- times + hours (hours fill in automatically from the times) -->
    <div id="hoursBlock">
      <div class="row3">
        <div class="field">
          <label for="inFrom">From</label>
          <input type="time" id="inFrom">
        </div>
        <div class="field">
          <label for="inTo">To</label>
          <input type="time" id="inTo">
        </div>
        <div class="field">
          <label for="inHours">Hours</label>
          <input type="number" id="inHours" min="0" max="24" step="0.25" placeholder="0">
        </div>
      </div>
      <div class="calc-line" id="calcLine"></div>
    </div>

    <div class="field">
      <label for="inNote">Note</label>
      <textarea id="inNote" placeholder="e.g. evening shift, event, school day…"></textarea>
    </div>

    <div class="modal-actions">
      <button class="btn danger" id="btnDeleteEntry" type="button">Clear day</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="btnCancelDay" type="button">Cancel</button>
      <button class="btn primary" id="btnSaveDay" type="button">Save</button>
    </div>
  </div>
</div>

<!-- ================= person editor pop-up ================== -->
<div class="overlay hidden" id="personOverlay" role="dialog" aria-modal="true" aria-labelledby="personTitle">
  <div class="modal">
    <h3 id="personTitle">Add person</h3>
    <div class="modal-sub">Everyone gets their own calendar and totals.</div>
    <div class="field">
      <label for="inName">Name</label>
      <input type="text" id="inName" placeholder="Name" maxlength="40">
    </div>
    <div class="row2">
      <div class="field">
        <label for="inStart">Can work from</label>
        <input type="date" id="inStart">
      </div>
      <div class="field">
        <label for="inEnd">Until</label>
        <input type="date" id="inEnd">
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn danger hidden" id="btnDeletePerson" type="button">Remove person</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="btnCancelPerson" type="button">Cancel</button>
      <button class="btn primary" id="btnSavePerson" type="button">Save</button>
    </div>
  </div>
</div>

<!-- short status message shown at the bottom of the screen -->
<div id="toast"></div>

<script src="script.js"></script>
