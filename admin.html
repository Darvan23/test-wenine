<!-- ============================================================
     Wenine Admin — the admin's control room.
     One table per month: every person side by side with the hours
     they logged. The admin checks a day, fixes it if needed, and
     confirms it — confirmed days lock for everyone but the admin.
     Styling:  css/stylesheet.css      Behavior: admin.js
     ============================================================ -->
<meta charset="utf-8">
<title>Wenine Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="css/stylesheet.css">
<script src="theme.js"></script>

<div class="wrap">
  <header class="top">
    <h1 class="wordmark">Wenine <small data-i18n="subAdmin">admin dashboard</small></h1>
    <nav class="page-nav">
      <a href="index.html" data-i18n="navHours">Hour tracker</a>
      <a href="schedule.html" data-i18n="navSchedule">Schedule</a>
      <a href="admin.html" class="current" data-i18n="navAdmin">Admin</a>
    </nav>
    <select class="lang-sel" id="langSel" aria-label="Language">
      <option value="en">EN</option>
      <option value="nl">NL</option>
    </select>
    <select class="lang-sel" id="themeSel" aria-label="Theme">
      <option value="auto" data-i18n="themeAuto">Auto</option>
      <option value="light" data-i18n="themeLight">Light</option>
      <option value="dark" data-i18n="themeDark">Dark</option>
    </select>
    <div class="admin-area" id="adminArea"></div>
  </header>

  <div id="mainArea"></div>
</div>

<!-- ============ day editor: check / fix / confirm ============ -->
<div class="overlay hidden" id="dayOverlay" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
  <div class="modal">
    <h3 id="dayTitle"></h3>
    <div class="modal-sub" id="daySub"></div>

    <div class="seg" id="statusSeg">
      <button type="button" class="worked" id="segWorked" data-i18n="worked">Worked</button>
      <button type="button" class="free" id="segFree" data-i18n="free">Free</button>
    </div>

    <div id="hoursBlock">
      <div class="row3">
        <div class="field">
          <label for="inFrom" data-i18n="from">From</label>
          <input type="time" id="inFrom">
        </div>
        <div class="field">
          <label for="inTo" data-i18n="to">To</label>
          <input type="time" id="inTo">
        </div>
        <div class="field">
          <label for="inHours" data-i18n="hours">Hours</label>
          <input type="number" id="inHours" min="0" max="24" step="0.25" placeholder="0">
        </div>
      </div>
    </div>

    <div class="field">
      <label for="inNote" data-i18n="note">Note</label>
      <textarea id="inNote"></textarea>
    </div>

    <label class="conf-row">
      <input type="checkbox" id="chkConf">
      <span data-i18n="confToggle">Confirmed — lock this day for everyone except the admin</span>
    </label>

    <div class="modal-actions">
      <button class="btn danger" id="btnDeleteEntry" type="button" data-i18n="clearDay">Clear day</button>
      <span class="spacer"></span>
      <button class="btn ghost" id="btnCancelDay" type="button" data-i18n="cancel">Cancel</button>
      <button class="btn primary" id="btnSaveDay" type="button" data-i18n="save">Save</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script src="i18n.js"></script>
<script src="admin.js"></script>
